<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container mt-4">
  <h2 class="text-center">💰 Expense Tracker</h2>

  <!-- Dashboard -->
  <div class="row text-center mt-3">
    <div class="col">
      <div class="card p-2">Balance: ₹<span id="balance">0</span></div>
    </div>
    <div class="col">
      <div class="card p-2">Income: ₹<span id="income">0</span></div>
    </div>
    <div class="col">
      <div class="card p-2">Expense: ₹<span id="expense">0</span></div>
    </div>
  </div>

  <!-- Form -->
  <div class="card p-3 mt-3">
    <input type="text" id="desc" placeholder="Description" class="form-control mb-2">

    <input type="number" id="amount" placeholder="Amount" class="form-control mb-2">

    <select id="type" class="form-control mb-2">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>

    <button onclick="addTransaction()" class="btn btn-primary">Add</button>
  </div>

  <!-- List -->
  <ul id="list" class="list-group mt-3"></ul>
</div>

<script src="index.js"></script>
</body>
</html>
